{n:"Speluppbyggnad",c:["Öppna kroppen mot spelriktningen innan bollen kommer","Första touchen tar dig bort från trycket","Träffa mitt på bollen, passa fast"],q:["Var kan du stå för att bli spelbar?","Vilken sida är öppen just nu?","Vem har bäst överblick över planen?"],cp:{"goal": "Behålla bollen och skapa möjligheter att spela framåt.", "pts": ["Scanna innan du får bollen.", "Var spelbar med rätt avstånd och vinkel.", "Orientera kroppen så att du har flera spelalternativ.", "Sök framåt när möjligheten finns.", "Flytta dig efter passningen."], "q": "Vad behöver du se innan du får bollen?"},kf:["Vi skapar bredd och djup så att bollhållaren har flera passningsalternativ.", "Vi erbjuder spelbara vinklar runt bollhållaren och undviker att stå på samma linje.", "Vi söker framåt när det finns en tydlig möjlighet, och behåller bollen när vägen framåt är stängd.", "Vi flyttar oss efter passningen för att skapa ett nytt alternativ och hålla spelet levande.", "Vi använder målvakten och den fria spelaren för att spela förbi motståndarens första press."],x:[{"t": "BONUS", "n": "A. Spela förbi första pressen", "d": "Mål efter att laget spelat förbi en eller flera motståndare i spelet ger 2 poäng. Vanligt mål ger 1 poäng.", "r": "spelbarhet, scanning och att identifiera passningar framåt."}, {"t": "BONUS", "n": "B. Använd hela spelytan", "d": "Mål ger 2 poäng om laget har utnyttjat både en central och en yttre korridor under anfallet. Annars 1 poäng.", "r": "bredd, spelbara vinklar och att flytta motståndarna."}, {"t": "REGEL", "n": "C. Målvakten är en spelare", "d": "Vid inspark eller återstart ska laget försöka spela igång bollen via målvakten eller en försvarare i stället för att automatiskt slå långt. Motståndarna får pressa.", "r": "skapa spelbara alternativ och fatta beslut under press."}],b:["Motorisk uppvärmning, knäkontroll och boll","Mottagning med öppen kropp, första touch och passningskvalitet","Rondo","Smålagsspel"]},
{n:"Förhindra speluppbyggnad",c:["Pressa i en kurva så att du stänger passlinjen","Korta steg de sista metrarna mot bollen","Håll ett avstånd där du når bollen men inte blir passerad"],q:["Vart vill vi leda motståndaren?","Vem pressar och vem täcker?","När är rätt tillfälle att gå på?"],cp:{"goal": "Begränsa motståndarens möjligheter att spela sig framåt.", "pts": ["Uppmärksamma när motståndaren har kontroll på bollen.", "Pressa när avstånd och situation tillåter.", "Styr motståndaren mot en mindre farlig yta.", "Täpp till passningsvägar.", "Samarbeta: en pressar, andra täcker."], "q": "Vad kan du göra för att göra nästa passning svårare?"},kf:["Vi pressar tillsammans när motståndaren har svårt att kontrollera bollen eller har få alternativ.", "När en spelare pressar, täcker vi närmaste passningsvägar och ytan bakom pressen.", "Vi styr motståndaren mot en sida eller en mindre farlig yta och förhindrar enkelt spel centralt.", "Vi flyttar laget tillsammans mot bollen utan att lämna farliga ytor obevakade.", "Vi samarbetar för att stänga framåtriktade passningar och tvinga motståndaren att spela bakåt eller åt sidan."],x:[{"t": "BONUS", "n": "A. Vinn bollen högt", "d": "Om laget vinner bollen på motståndarens planhalva och gör mål inom 8 sekunder får målet 2 poäng. Vanligt mål ger 1 poäng.", "r": "pressignaler, aggressivitet och gemensamt pressarbete."}, {"t": "BONUS", "n": "B. Press och täckning", "d": "Om laget bryter motståndarens anfall efter att ha styrt spelet mot en sida och täckt passningsalternativen får laget 1 bonuspoäng.", "r": "pressvinkel, understöd och att försvara tillsammans."}, {"t": "REGEL", "n": "C. Stäng centralt", "d": "Placera en markerad central korridor. Försvarande lag får en poäng om det tvingar motståndarna att spela ut ur korridoren och därefter återvinner bollen.", "r": "skydda centrala ytor och styra motståndaren."}],b:["Motorisk uppvärmning, knäkontroll och boll","Pressvinkel, fotarbete och avstånd till medspelare","Rondo","Smålagsspel"]},
